repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.5
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/astral-sh/uv-pre-commit
    # uv version.
    rev: 0.9.7
    hooks:
      # Update the uv lockfile
      - id: uv-lock

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # Don't add large files to git. The README demo gif is the one deliberate
      # exception; it is excluded from the sdist with the other images.
      - id: check-added-large-files
        args: ["--maxkb=500"]
        exclude: ^docs/images/dashboard-demo\.gif$
      # Don't commit directly to main
      - id: no-commit-to-branch
      # Don't commit unresolved merge conflicts
      - id: check-merge-conflict
      # Check that various config files are well-formatted
      - id: check-toml
      # mkdocs.yml carries a `!!python/name:` tag for the mermaid fence, which
      # the safe loader refuses. --unsafe checks the syntax only.
      - id: check-yaml
        args: [--unsafe]

  # format markdown and yaml files. The upstream pre-commit/mirrors-prettier is
  # archived (frozen at prettier 3.1); this is the maintained community mirror.
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.5
    hooks:
      - id: prettier
        name: prettier (markdown)
        types: [markdown]
        args: ["--prose-wrap", "always", "--print-width", "100"]
      # format the frontend sources (TS/TSX/CSS). prettier's built-in parsers
      # cover these, so no extra plugins are needed.
      - id: prettier
        name: prettier (frontend)
        files: ^frontend/src/.*\.(ts|tsx|css)$

  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.0
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml"]
        additional_dependencies: ["bandit[toml]"]

  - repo: local
    hooks:
      - id: basedpyright
        name: basedpyright
        entry: uv run basedpyright
        language: system
        types: [python]
