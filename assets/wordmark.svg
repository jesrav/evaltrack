<svg width="360" height="72" viewBox="0 0 360 72" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- evaltrack wordmark. Colours chosen to stay legible on both light and
       dark backgrounds (GitHub themes): slate "eval", accent-blue "track",
       and the check-line glyph in accent + pass-green. -->
  <g transform="translate(6,12)">
    <polyline points="6,28 18,40 46,12"
              stroke="#3f6fe4" stroke-width="6.5"
              stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="6" cy="28" r="3.8" fill="#3f6fe4"/>
    <circle cx="46" cy="12" r="4.6" fill="#16a35a"/>
  </g>
  <text x="68" y="48"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="36" font-weight="600" letter-spacing="-1">
    <tspan fill="#8892a6">eval</tspan><tspan fill="#3f6fe4">track</tspan>
  </text>
</svg>
