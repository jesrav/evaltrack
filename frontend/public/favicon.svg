<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- evaltrack favicon: check-line on a rounded accent tile. The filled tile
       keeps the mark legible at 16px where a thin stroke would disappear. -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="#3f6fe4"/>
  <polyline points="15,33 27,45 50,18"
            stroke="#ffffff" stroke-width="7"
            stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <circle cx="50" cy="18" r="5" fill="#9fffd0"/>
</svg>
