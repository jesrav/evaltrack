<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The page holds everything it needs, so it forbids itself the network. The
         build inlines its script and styles, which is all the policy admits. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'"
    />
    <title>evaltrack report</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- `evaltrack report` fills this with the run. The build leaves it empty. -->
    <script type="application/json" id="evaltrack-data"></script>
    <script type="module" src="/src/report.tsx"></script>
  </body>
</html>
